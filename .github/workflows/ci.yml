name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slay
          POSTGRES_PASSWORD: slay
          POSTGRES_DB: slay_jeans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slay -d slay_jeans_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://slay:slay@localhost:5432/slay_jeans_test?schema=public
      DIRECT_URL: postgresql://slay:slay@localhost:5432/slay_jeans_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-used-in-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-prod
      COOKIE_SECRET: ci-cookie-secret-not-used-in-prod
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate + validate
        run: |
          pnpm --filter @slay/db generate
          pnpm exec prisma validate --schema packages/db/prisma/schema.prisma

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
