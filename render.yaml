# Render Blueprint — deploys the Velor House storefront, admin and API.
# (Service names stay `slay-jeans-*` so the existing *.onrender.com URLs keep working.)
# https://render.com/docs/blueprint-spec
#
# 1. Push this repo to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Render creates the 3 services below. Fill in the secret env vars it asks for
#    (marked `sync: false`): DATABASE_URL, DIRECT_URL, and — if you want emails —
#    SMTP_HOST / SMTP_USER / SMTP_PASSWORD.
# 4. If Render appends a random suffix to any service name, update the *_URL,
#    CORS_ALLOWED_ORIGINS and NEXT_PUBLIC_API_URL values to the real URLs and
#    redeploy. (See DEPLOY.md.)
#
# Region "ohio" is AWS us-east-2 — the same region as the Neon database.

services:
  # ---------------------------------------------------------------- API (NestJS)
  - type: web
    name: slay-jeans-api
    runtime: node
    region: ohio
    plan: free # change to `starter` before real launch so it never sleeps
    autoDeploy: true
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/config build &&
      pnpm --filter @slay/db build &&
      pnpm --filter @slay/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon DIRECT (unpooled) connection string
        sync: false
      - key: DIRECT_URL # same value as DATABASE_URL is fine
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: API_URL
        value: https://slay-jeans-api.onrender.com
      - key: WEB_URL # canonical public storefront domain (used in email links)
        value: https://velorhouse.in
      - key: ADMIN_URL
        value: https://slay-jeans-admin.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://slay-jeans-web.onrender.com,https://slay-jeans-admin.onrender.com,https://velorhouse.in,https://www.velorhouse.in,https://admin.velorhouse.in
      - key: EMAIL_FROM
        value: Velor House <velorhouse@gmail.com>
      - key: SMTP_HOST # optional — leave unset to skip sending emails
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Razorpay live payments — add the real values in the Render dashboard,
      # never in Git. Without these, checkout stays Cash-on-Delivery only.
      #   KEY_ID / KEY_SECRET  -> Razorpay Dashboard > Settings > API Keys
      #   WEBHOOK_SECRET       -> Razorpay Dashboard > Settings > Webhooks
      #   Webhook URL to add:  https://slay-jeans-api.onrender.com/api/v1/webhooks/payments/razorpay
      #   Events:  payment.captured, payment.failed, order.paid
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Customer OTP login. Preferred: the MSG91 "Secure OTP" widget — set
      # MSG91_AUTH_KEY (secret) + MSG91_WIDGET_ID + MSG91_WIDGET_TOKEN_AUTH (both
      # public, from MSG91 -> OTP -> your widget -> Configuration). The storefront
      # reads the widget params from GET /auth/otp/config, so nothing to set on
      # the web service and no rebuild needed.
      # Fallback (no widget configured): the API texts its own code — needs
      #   MSG91:  AUTH_KEY + SENDER_ID (+ optional OTP_TEMPLATE_ID) -> msg91.com
      #   Twilio: ACCOUNT_SID + AUTH_TOKEN + FROM (a number or MG… Messaging SID)
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_WIDGET_ID
        sync: false
      - key: MSG91_WIDGET_TOKEN_AUTH
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      # Checkout PIN-code validation (City/State auto-fill + serviceability).
      # Keyless India Post lookup — no secret; resolved PINs are cached in the DB.
      - key: PINCODE_PROVIDER
        value: indiapost
      - key: PINCODE_LOOKUP_TIMEOUT_MS
        value: "4000"

  # ---------------------------------------------------------- Storefront (Next.js)
  - type: web
    name: slay-jeans-web
    runtime: node
    region: ohio
    plan: free # change to `starter` before real launch
    autoDeploy: true
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/web build
    startCommand: pnpm --filter @slay/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL # baked in at build time
        value: https://slay-jeans-api.onrender.com
      - key: WEB_URL # canonical public domain (SEO / sitemap / OG / email links)
        value: https://velorhouse.in

  # --------------------------------------------------------------- Admin (Next.js)
  - type: web
    name: slay-jeans-admin
    runtime: node
    region: ohio
    plan: free
    autoDeploy: true
    # Branded dashboard URL. Works once a DNS CNAME  admin -> slay-jeans-admin.onrender.com
    # is added at the domain registrar; until then the .onrender.com URL is canonical.
    domains:
      - admin.velorhouse.in
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/admin build
    startCommand: pnpm --filter @slay/admin start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://slay-jeans-api.onrender.com
      - key: ADMIN_URL
        value: https://slay-jeans-admin.onrender.com
