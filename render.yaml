# Render Blueprint — deploys the Velor House storefront, admin and API.
# (Service names stay `slay-jeans-*` so the existing *.onrender.com URLs keep working.)
# https://render.com/docs/blueprint-spec
#
# 1. Push this repo to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Render creates the 3 services below. Fill in the secret env vars it asks for
#    (marked `sync: false`): DATABASE_URL, DIRECT_URL, and — if you want emails —
#    SMTP_HOST / SMTP_USER / SMTP_PASSWORD.
# 4. If Render appends a random suffix to any service name, update the *_URL,
#    CORS_ALLOWED_ORIGINS and NEXT_PUBLIC_API_URL values to the real URLs and
#    redeploy. (See DEPLOY.md.)
#
# Region "ohio" is AWS us-east-2 — the same region as the Neon database.

services:
  # ---------------------------------------------------------------- API (NestJS)
  - type: web
    name: slay-jeans-api
    runtime: node
    region: ohio
    plan: free # change to `starter` before real launch so it never sleeps
    autoDeploy: true
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/config build &&
      pnpm --filter @slay/db build &&
      pnpm --filter @slay/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon DIRECT (unpooled) connection string
        sync: false
      - key: DIRECT_URL # same value as DATABASE_URL is fine
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: API_URL
        value: https://slay-jeans-api.onrender.com
      - key: WEB_URL
        value: https://slay-jeans-web.onrender.com
      - key: ADMIN_URL
        value: https://slay-jeans-admin.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://slay-jeans-web.onrender.com,https://slay-jeans-admin.onrender.com,https://velorhouse.in,https://www.velorhouse.in
      - key: EMAIL_FROM
        value: Velor House <velorhouse@gmail.com>
      - key: SMTP_HOST # optional — leave unset to skip sending emails
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ---------------------------------------------------------- Storefront (Next.js)
  - type: web
    name: slay-jeans-web
    runtime: node
    region: ohio
    plan: free # change to `starter` before real launch
    autoDeploy: true
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/web build
    startCommand: pnpm --filter @slay/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL # baked in at build time
        value: https://slay-jeans-api.onrender.com
      - key: WEB_URL
        value: https://slay-jeans-web.onrender.com

  # --------------------------------------------------------------- Admin (Next.js)
  - type: web
    name: slay-jeans-admin
    runtime: node
    region: ohio
    plan: free
    autoDeploy: true
    buildCommand: >-
      npm i -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @slay/admin build
    startCommand: pnpm --filter @slay/admin start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://slay-jeans-api.onrender.com
      - key: ADMIN_URL
        value: https://slay-jeans-admin.onrender.com
