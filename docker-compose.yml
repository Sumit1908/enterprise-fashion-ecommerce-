# Local infrastructure for Slay Jeans.
# Usage:  docker compose up -d      (start)   /   docker compose down   (stop)
# Data persists in named volumes below.

services:
  postgres:
    image: postgres:16-alpine
    container_name: slay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slay
      POSTGRES_PASSWORD: slay
      POSTGRES_DB: slay_jeans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slay -d slay_jeans"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: slay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: slay-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # S3-compatible local storage (stand-in for AWS S3 during development).
  minio:
    image: minio/minio:latest
    container_name: slay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slay
      MINIO_ROOT_PASSWORD: slaysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Optional GUI for the database at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: slay-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
  esdata:
  miniodata:
